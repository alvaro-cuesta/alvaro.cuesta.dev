packages:
  - alvaro.cuesta.dev
  - packages/*

# Runs scripts with pnpm's own shell, so `NAME=value command` works on Windows too.
shellEmulator: true

# Install scripts run whatever they like, so each is allowed for one version:
# another version's script fails the install (`strictDepBuilds`) until it's
# looked at and its version written here.
allowBuilds:
  # Its postinstall swaps its JS shim for the platform's binary, which starts faster.
  esbuild@0.28.2: true

# A week, like Dependabot's cooldown, for a compromised release to be caught and
# pulled first. Set explicitly to make it strict: fail rather than take a younger
# version.
minimumReleaseAge: 10080
# npm dates every version, so an undated one is suspect: fail instead of skipping
# its age and trust checks.
minimumReleaseAgeIgnoreMissingTime: false

# Fails on a release with less trust than the ones before it (e.g. without their
# provenance), which is what a stolen publish token tends to look like.
trustPolicy: no-downgrade

# Fails instead of warning when a dependency gets a peer version it doesn't
# support, so the mismatch is fixed or accepted below, not just scrolled past.
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # They only take TypeScript's types from it: the editor hands them its own
    # TypeScript (6, see `.vscode/settings.json`).
    "@volar/typescript>typescript": "7"
    "@volar/language-service>typescript": "7"

catalog:
  "@types/express": ^5.0.6
  "@types/node": ^26.6.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  express: ^5.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  type-fest: ^5.5.0
  # The beta, for `declare module ... with { ... }` (types by import attributes).
  # Exact, as a range wouldn't move on to the stable 7.1.
  typescript: 7.1.0-beta
  vitest: ^5.0.5
  xmlbuilder2: ^4.0.3

overrides:
  # For its denial of service fix: serve pins an exact version, and its latest
  # (14.2.6) still pins the vulnerable one.
  serve>compression: ^1.8.2
  # For its prototype pollution fix: rehype-katex and micromark-extension-math's
  # latest still ask for 0.16, but none of 0.17 and 0.18's breaking changes
  # touch what they use. Not 0.19, which changes what `strict` reports.
  katex: ^0.18.2

audit:
  ignore:
    # minimatch's denial of service on crafted patterns: only serve-handler (from
    # serve) uses it, at 3.1.5, which predates the vulnerable code. Its patterns
    # come from serve's config, not requests, and the fix (11) breaks its API.
    - GHSA-g3hv-75wg-m249

patchedDependencies:
  # Its entry point imports every grammar (about 0.5 s, against 50 ms for the
  # common ones the site uses), and nothing else exports `createStarryNight`.
  # Still so in 3.11.0.
  "@wooorm/starry-night": patches/@wooorm__starry-night.patch
