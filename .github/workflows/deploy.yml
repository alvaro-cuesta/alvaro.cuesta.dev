name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "**/TODO.md"

  # Lints, tests and builds, to catch breakage before merging. Doesn't deploy.
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "**/TODO.md"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Whole runs, not just the deploy job: builds can finish out of order, so an older run's deploy could overwrite a
# newer one's.
concurrency:
  # One run at a time, and one waiting: a newer push replaces the waiting run, so the last push always runs last.
  # Per ref, so a pull request's runs never replace a deploy waiting on main.
  group: pages-${{ github.ref }}
  # Pull requests: a newer push makes the older runs pointless.
  # Not main:
  # - the newer run may fail, and the older one would have deployed something newer than what's live;
  # - pushing faster than a run takes would cancel every run, and nothing would deploy;
  # - cancelling deploy-pages midway isn't safe (GitHub's Pages starter workflow warns against it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_PATH: alvaro.cuesta.dev

jobs:
  lint:
    name: Lint ${{ matrix.linter.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linter:
          - { name: "TypeScript", script: "lint:tsc" }
          # - { name: "Prettier", script: "lint:prettier" }
          # - { name: "ESLint", script: "lint:eslint" }
          # - { name: "Knip", script: "lint:knip" }
          # - { name: "Madge", script: "lint:madge" }
    steps:
      - &checkout
        name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # We need the full history for "last modified" dates in blog posts
        with:
          fetch-depth: 0

      # pnpm at the version `package.json` pins, Node.js at `.nvmrc`'s, then the dependencies.
      - &setup
        name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          # pnpm already won't change the lockfile in CI, but without one it would resolve from the registry.
          require-lockfile: true

      # From the workspace root, to check every package.
      - name: Run ${{ matrix.linter.name }}
        run: pnpm run ${{ matrix.linter.script }}

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - alvaro.cuesta.dev
          - packages/core
          - packages/express-plugin-feeds
          - packages/express-plugin-sitemap
          - packages/hot-reload
          - packages/thunks
    steps:
      - *checkout
      - *setup

      - name: Run tests
        run: pnpm test
        working-directory: ${{ matrix.package }}

  build:
    name: Build
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - *checkout
      - *setup

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Xenon SSG
        env:
          XENON_ORIGIN: ${{ steps.pages.outputs.origin }}
          XENON_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        # Runs with `-o pipefail`, so the build failing still fails the step despite the `tee`.
        shell: bash
        # The log goes outside the checkout, so the clean repository check below doesn't trip on it.
        run: pnpm run build 2>&1 | tee "$RUNNER_TEMP/build-output.log"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Add build log to the run summary
        # Also when the build fails, which is when its log matters most.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "# Build"
            echo ""
            echo "- **Node.js:** $(node --version)"
            echo "- **pnpm:** $(pnpm --version)"
            echo ""
            # Tildes, not backticks: code in the output can have backticks, but a build log won't start a line with tildes.
            echo "~~~~~~~~"
            # Strip ANSI colors
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build-output.log" || echo "(no build log)"
            echo "~~~~~~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      # A build that changes tracked files (or leaves files Git doesn't ignore) works here, but not from a clean checkout
      # of the same commit.
      - name: Verify the build left the repository clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The build changed the repository. Commit or ignore these files:"
            git status --porcelain

            {
              echo "> [!CAUTION]"
              echo "> The build changed the repository. Commit or ignore these files:"
              echo ""
              echo '~~~~~~~~'
              git status --porcelain
              echo '~~~~~~~~'
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.BUILD_PATH }}/dist

  # Not grouped on its own: see `concurrency`.
  deploy:
    # Only main is the site: pull requests and manual runs on other branches stop after the build.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
