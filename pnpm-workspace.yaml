packages:
  - alvaro.cuesta.dev
  - packages/*

# Runs scripts with pnpm's own shell, so `NAME=value command` works on Windows too.
shellEmulator: true

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@types/express": ^5.0.6
  "@types/node": ^26.6.4
  "@types/react": ^19.2.5
  "@types/react-dom": ^19.2.3
  react: ^19.2.5
  react-dom: ^19.2.5
  type-fest: ^5.5.0
  typescript: ^7.0.2
  vitest: ^4.1.4
  xmlbuilder2: ^4.0.3

patchedDependencies:
  "@wooorm/starry-night": patches/@wooorm__starry-night.patch
