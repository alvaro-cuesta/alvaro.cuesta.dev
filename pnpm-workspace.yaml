packages:
  - alvaro.cuesta.dev
  - packages/*

# Runs scripts with pnpm's own shell, so `NAME=value command` works on Windows too.
shellEmulator: true

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@types/express": ^5.0.6
  "@types/node": ^26.6.4
  "@types/react": ^19.2.5
  "@types/react-dom": ^19.2.3
  express: ^5.3.0
  react: ^19.2.5
  react-dom: ^19.2.5
  type-fest: ^5.5.0
  typescript: ^7.0.2
  vitest: ^4.1.12
  xmlbuilder2: ^4.0.3

overrides:
  # For its denial of service fix: serve pins an exact version, and its latest
  # (14.2.6) still pins the vulnerable one.
  serve>compression: ^1.8.2
  # For its prototype pollution fix: rehype-katex and micromark-extension-math's
  # latest still ask for 0.16, but none of 0.17 and 0.18's breaking changes
  # touch what they use. Not 0.19, which changes what `strict` reports.
  katex: ^0.18.2

patchedDependencies:
  "@wooorm/starry-night": patches/@wooorm__starry-night.patch
